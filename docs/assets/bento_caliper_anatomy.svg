<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <style>
    .mono { font-family: "SF Mono", Monaco, "JetBrains Mono", Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .dim-line { stroke: #FF5500; stroke-width: 1; stroke-dasharray: 2,2; }
    .dim-text { font-family: "SF Mono", monospace; font-size: 10px; font-weight: 700; fill: #FF5500; }
  </style>

  <!-- Background Chassis -->
  <rect width="900" height="480" rx="12" fill="#F5F3EC" stroke="#C9C3B5" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="0" y="0" width="900" height="50" rx="12" fill="#EBE7DD"/>
  <rect x="0" y="40" width="900" height="10" fill="#EBE7DD"/>
  <line x1="0" y1="50" x2="900" y2="50" stroke="#C9C3B5" stroke-width="1.2"/>

  <circle cx="28" cy="25" r="5" fill="#FF5500"/>
  <text x="42" y="30" class="mono" font-size="13" font-weight="900" fill="#191919" letter-spacing="1.5">BENTO CALIPER MATRIX // GEOMETRIC ANATOMY &amp; SPECIFICATION</text>
  <text x="860" y="29" class="mono" font-size="10" font-weight="700" fill="#6A6A6A" text-anchor="end">GOLDEN RATIO · 4.0dp CALIPER GAPS</text>

  <!-- LEFT: LARGE ENLARGED ICON CANVAS (320x320) -->
  <g transform="translate(60, 90)">
    <!-- Outer Safe Zone circle indicator -->
    <circle cx="160" cy="160" r="160" fill="none" stroke="#DCD8CD" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="160" cy="160" r="140" fill="#FFFFFF" stroke="#C9C3B5" stroke-width="1.5"/>

    <!-- Scaled Bento Tiles (scale factor = 4.0 from 56x56 base, centered at 160,160) -->
    <!-- Docs: (0,0) -> scaled w=136, h=104, r=20 -->
    <g transform="translate(48, 48)">
      <!-- 1. Documents -->
      <rect x="0" y="0" width="136" height="104" rx="20" fill="#EBE7DD" stroke="#C9C3B5" stroke-width="2"/>
      <line x1="24" y1="32" x2="88" y2="32" stroke="#191919" stroke-width="8" stroke-linecap="round"/>
      <line x1="24" y1="56" x2="72" y2="56" stroke="#6A6A6A" stroke-width="5.6" stroke-linecap="round"/>
      <text x="68" y="85" class="mono" font-size="10" font-weight="700" fill="#6A6A6A" text-anchor="middle">34w × 26h</text>

      <!-- 2. Video: (x=152, y=0) -> w=72, h=136, r=20 -->
      <rect x="152" y="0" width="72" height="136" rx="20" fill="#EBE7DD" stroke="#C9C3B5" stroke-width="2"/>
      <polygon points="176,54 206,68 176,82" fill="#191919"/>
      <text x="188" y="115" class="mono" font-size="10" font-weight="700" fill="#6A6A6A" text-anchor="middle">18w × 34h</text>

      <!-- 3. Graphics: (x=0, y=120) -> w=88, h=104, r=20 -->
      <rect x="0" y="120" width="88" height="104" rx="20" fill="#EBE7DD" stroke="#C9C3B5" stroke-width="2"/>
      <circle cx="44" cy="172" r="18" fill="none" stroke="#191919" stroke-width="6"/>
      <circle cx="44" cy="172" r="8" fill="#191919"/>
      <text x="44" y="208" class="mono" font-size="10" font-weight="700" fill="#6A6A6A" text-anchor="middle">22w × 26h</text>

      <!-- 4. Utility Engine: (x=104, y=152) -> w=120, h=72, r=20 -->
      <rect x="104" y="152" width="120" height="72" rx="20" fill="#FF5500"/>
      <line x1="132" y1="188" x2="196" y2="188" stroke="#161618" stroke-width="8.8" stroke-linecap="round"/>
      <text x="164" y="212" class="mono" font-size="10" font-weight="700" fill="#161618" text-anchor="middle">30w × 18h</text>

      <!-- Staggered Caliper Dimension Callouts -->
      <!-- Vertical Gap 1 -->
      <line x1="136" y1="52" x2="152" y2="52" stroke="#FF5500" stroke-width="1.5"/>
      <circle cx="136" cy="52" r="2" fill="#FF5500"/>
      <circle cx="152" cy="52" r="2" fill="#FF5500"/>
      <text x="144" y="44" class="dim-text" text-anchor="middle">4.0</text>

      <!-- Horizontal Gap 1 -->
      <line x1="44" y1="104" x2="44" y2="120" stroke="#FF5500" stroke-width="1.5"/>
      <circle cx="44" cy="104" r="2" fill="#FF5500"/>
      <circle cx="44" cy="120" r="2" fill="#FF5500"/>
      <text x="56" y="115" class="dim-text">4.0</text>

      <!-- Horizontal Gap 2 -->
      <line x1="188" y1="136" x2="188" y2="152" stroke="#FF5500" stroke-width="1.5"/>
      <circle cx="188" cy="136" r="2" fill="#FF5500"/>
      <circle cx="188" cy="152" r="2" fill="#FF5500"/>
      <text x="200" y="147" class="dim-text">4.0</text>

      <!-- Vertical Gap 2 -->
      <line x1="88" y1="188" x2="104" y2="188" stroke="#FF5500" stroke-width="1.5"/>
      <circle cx="88" cy="188" r="2" fill="#FF5500"/>
      <circle cx="104" cy="188" r="2" fill="#FF5500"/>
      <text x="96" y="180" class="dim-text" text-anchor="middle">4.0</text>
    </g>
  </g>

  <!-- RIGHT: SPECIFICATION & RULES PANEL -->
  <g transform="translate(460, 90)">
    <rect width="380" height="350" rx="8" fill="#FFFFFF" stroke="#C9C3B5" stroke-width="1"/>
    
    <text x="24" y="36" class="mono" font-size="12" font-weight="900" fill="#191919">ARCHITECTURAL DESIGN RULES</text>
    <line x1="24" y1="46" x2="356" y2="46" stroke="#C9C3B5" stroke-width="1"/>

    <!-- Rule 1 -->
    <text x="24" y="72" class="mono" font-size="11" font-weight="800" fill="#FF5500">01 // ASYMMETRIC PINWHEEL</text>
    <text x="24" y="90" class="sans" font-size="12" fill="#191919">No dividing caliper line cuts through the entire</text>
    <text x="24" y="106" class="sans" font-size="12" fill="#191919">chassis. Each axis is staggered by 8dp to 16dp,</text>
    <text x="24" y="122" class="sans" font-size="12" fill="#6A6A6A">creating dynamic mechanical equilibrium.</text>

    <!-- Rule 2 -->
    <text x="24" y="152" class="mono" font-size="11" font-weight="800" fill="#FF5500">02 // GOLDEN RATIO PROPORTIONS</text>
    <text x="24" y="170" class="sans" font-size="12" fill="#191919">Docs is wide (34×26). Video is tall (18×34).</text>
    <text x="24" y="186" class="sans" font-size="12" fill="#191919">Graphics is square (22×26). Utility is engine-wide</text>
    <text x="24" y="202" class="sans" font-size="12" fill="#6A6A6A">(30×18) in solid high-visibility Braun Orange.</text>

    <!-- Rule 3 -->
    <text x="24" y="232" class="mono" font-size="11" font-weight="800" fill="#FF5500">03 // UNIFORM 4.0dp CALIPER GAPS</text>
    <text x="24" y="250" class="sans" font-size="12" fill="#191919">Every separation channel between adjacent tiles</text>
    <text x="24" y="266" class="sans" font-size="12" fill="#191919">is laser-calibrated to exactly 4.0dp, ensuring</text>
    <text x="24" y="282" class="sans" font-size="12" fill="#6A6A6A">flawless scaling from 20dp icons to 512dp posters.</text>

    <!-- Rule 4 -->
    <text x="24" y="312" class="mono" font-size="11" font-weight="800" fill="#FF5500">04 // 5dp CORNER RADII (4.5:1 RATIO)</text>
    <text x="24" y="330" class="sans" font-size="12" fill="#6A6A6A">Internal corners maintain a 5dp radius for smooth tactility.</text>
  </g>
</svg>
