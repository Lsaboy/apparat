<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <style>
    .mono { font-family: "SF Mono", Monaco, "JetBrains Mono", Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .label { font-size: 11px; font-weight: 700; fill: #6A6A6A; letter-spacing: 1px; }
    .hex { font-size: 13px; font-weight: 800; }
    .sub { font-size: 10px; font-weight: 500; fill: #6A6A6A; }
    .contrast { font-size: 10px; font-weight: 700; }
  </style>

  <!-- Background Chassis -->
  <rect width="900" height="440" rx="12" fill="#F5F3EC" stroke="#C9C3B5" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="0" y="0" width="900" height="54" rx="12" fill="#EBE7DD"/>
  <rect x="0" y="44" width="900" height="10" fill="#EBE7DD"/>
  <line x1="0" y1="54" x2="900" y2="54" stroke="#C9C3B5" stroke-width="1.2"/>

  <!-- Header Text -->
  <circle cx="28" cy="27" r="5" fill="#FF5500"/>
  <text x="42" y="32" class="mono" font-size="14" font-weight="900" fill="#191919" letter-spacing="1.5">APPARAT // PALETTE 01: CLASSIC IVORY (LIGHT MODE)</text>
  <text x="860" y="31" class="mono" font-size="10" font-weight="700" fill="#6A6A6A" text-anchor="end">DAYLIGHT LEGIBILITY · MATTE ABS CASING</text>

  <!-- ROW 1: PRIMARY BRAND & SURFACES -->
  <!-- Chip 1: Signal Orange -->
  <g transform="translate(30, 80)">
    <rect width="195" height="145" rx="8" fill="#FF5500" stroke="#E04B00" stroke-width="1"/>
    <rect x="12" y="12" width="171" height="60" rx="4" fill="#161618"/>
    <text x="97" y="38" class="mono" font-size="11" font-weight="900" fill="#FF5500" text-anchor="middle">ON-ORANGE TEXT</text>
    <text x="97" y="55" class="mono contrast" fill="#FFFFFF" text-anchor="middle">8.5:1 WCAG AAA</text>
    <text x="14" y="98" class="mono" font-size="12" font-weight="900" fill="#161618">BRAUN ORANGE</text>
    <text x="14" y="115" class="mono hex" fill="#161618">#FF5500</text>
    <text x="14" y="132" class="mono" font-size="10" fill="#3A1800">Primary Tactile Action</text>
  </g>

  <!-- Chip 2: Ivory Background -->
  <g transform="translate(245, 80)">
    <rect width="195" height="145" rx="8" fill="#FFFFFF" stroke="#C9C3B5" stroke-width="1"/>
    <rect x="12" y="12" width="171" height="60" rx="4" fill="#F5F3EC" stroke="#C9C3B5" stroke-width="1"/>
    <text x="97" y="46" class="mono" font-size="10" font-weight="700" fill="#191919" text-anchor="middle">CANVAS BASE</text>
    <text x="14" y="98" class="mono" font-size="12" font-weight="900" fill="#191919">IVORY CANVAS</text>
    <text x="14" y="115" class="mono hex" fill="#191919">#F5F3EC</text>
    <text x="14" y="132" class="mono sub">rgb(245, 243, 236)</text>
  </g>

  <!-- Chip 3: Ivory Surface -->
  <g transform="translate(460, 80)">
    <rect width="195" height="145" rx="8" fill="#FFFFFF" stroke="#C9C3B5" stroke-width="1"/>
    <rect x="12" y="12" width="171" height="60" rx="4" fill="#EBE7DD" stroke="#C9C3B5" stroke-width="1"/>
    <text x="97" y="46" class="mono" font-size="10" font-weight="700" fill="#191919" text-anchor="middle">CARD / TILE FILL</text>
    <text x="14" y="98" class="mono" font-size="12" font-weight="900" fill="#191919">IVORY SURFACE</text>
    <text x="14" y="115" class="mono hex" fill="#191919">#EBE7DD</text>
    <text x="14" y="132" class="mono sub">rgb(235, 231, 221)</text>
  </g>

  <!-- Chip 4: Ivory Surface Elevated -->
  <g transform="translate(675, 80)">
    <rect width="195" height="145" rx="8" fill="#FFFFFF" stroke="#C9C3B5" stroke-width="1"/>
    <rect x="12" y="12" width="171" height="60" rx="4" fill="#FFFFFF" stroke="#C9C3B5" stroke-width="1"/>
    <text x="97" y="46" class="mono" font-size="10" font-weight="700" fill="#191919" text-anchor="middle">INPUTS &amp; CAPS</text>
    <text x="14" y="98" class="mono" font-size="12" font-weight="900" fill="#191919">ELEVATED PURE</text>
    <text x="14" y="115" class="mono hex" fill="#191919">#FFFFFF</text>
    <text x="14" y="132" class="mono sub">rgb(255, 255, 255)</text>
  </g>

  <!-- ROW 2: BORDERS & TYPOGRAPHY -->
  <!-- Chip 5: Hairline Border -->
  <g transform="translate(30, 250)">
    <rect width="195" height="150" rx="8" fill="#FFFFFF" stroke="#C9C3B5" stroke-width="1"/>
    <rect x="12" y="12" width="171" height="60" rx="4" fill="#C9C3B5"/>
    <rect x="24" y="24" width="147" height="36" rx="2" fill="#F5F3EC"/>
    <text x="97" y="46" class="mono" font-size="10" font-weight="700" fill="#191919" text-anchor="middle">1px STRUCTURE</text>
    <text x="14" y="98" class="mono" font-size="12" font-weight="900" fill="#191919">MILLED BORDER</text>
    <text x="14" y="115" class="mono hex" fill="#191919">#C9C3B5</text>
    <text x="14" y="132" class="mono sub">Zero-shadow hairline</text>
  </g>

  <!-- Chip 6: Text Primary -->
  <g transform="translate(245, 250)">
    <rect width="195" height="150" rx="8" fill="#FFFFFF" stroke="#C9C3B5" stroke-width="1"/>
    <rect x="12" y="12" width="171" height="60" rx="4" fill="#191919"/>
    <text x="97" y="40" class="sans" font-size="15" font-weight="800" fill="#F5F3EC" text-anchor="middle">Aa Bb Gg 69</text>
    <text x="97" y="58" class="mono contrast" fill="#FF5500" text-anchor="middle">14.2:1 AAA RATIO</text>
    <text x="14" y="98" class="mono" font-size="12" font-weight="900" fill="#191919">TEXT PRIMARY</text>
    <text x="14" y="115" class="mono hex" fill="#191919">#191919</text>
    <text x="14" y="132" class="mono sub">Headlines &amp; Data</text>
  </g>

  <!-- Chip 7: Text Secondary -->
  <g transform="translate(460, 250)">
    <rect width="195" height="150" rx="8" fill="#FFFFFF" stroke="#C9C3B5" stroke-width="1"/>
    <rect x="12" y="12" width="171" height="60" rx="4" fill="#6A6A6A"/>
    <text x="97" y="40" class="sans" font-size="14" font-weight="600" fill="#F5F3EC" text-anchor="middle">Aa Bb Gg 69</text>
    <text x="97" y="58" class="mono contrast" fill="#FFFFFF" text-anchor="middle">4.8:1 AA RATIO</text>
    <text x="14" y="98" class="mono" font-size="12" font-weight="900" fill="#191919">TEXT SECONDARY</text>
    <text x="14" y="115" class="mono hex" fill="#191919">#6A6A6A</text>
    <text x="14" y="132" class="mono sub">Labels &amp; Units</text>
  </g>

  <!-- Chip 8: Text Tertiary -->
  <g transform="translate(675, 250)">
    <rect width="195" height="150" rx="8" fill="#FFFFFF" stroke="#C9C3B5" stroke-width="1"/>
    <rect x="12" y="12" width="171" height="60" rx="4" fill="#9E9E9E"/>
    <text x="97" y="46" class="mono" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">MODEL 69 // STAT</text>
    <text x="14" y="98" class="mono" font-size="12" font-weight="900" fill="#191919">TEXT TERTIARY</text>
    <text x="14" y="115" class="mono hex" fill="#191919">#9E9E9E</text>
    <text x="14" y="132" class="mono sub">Counters &amp; Timestamps</text>
  </g>
</svg>
