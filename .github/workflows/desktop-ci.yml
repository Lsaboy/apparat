name: Desktop CI

on:
  push:
    branches: [ 'desktop-port' ]
    paths: [ 'desktop/**', 'app/src/main/java/**', 'app/src/test/java/**', '.github/workflows/desktop-ci.yml' ]
  pull_request:
    paths: [ 'desktop/**', 'app/src/main/java/**', 'app/src/test/java/**' ]
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop libraries (present on any desktop Linux; the bundled FFmpeg links PulseAudio/ALSA/XCB)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpulse0 libasound2t64 libxcb1 libx11-xcb1 libxcb-shm0 xvfb imagemagick > /dev/null
      - name: Compile
        run: ./gradlew -p desktop :app:compileKotlin :app:compileTestKotlin --continue
      - name: Test
        run: ./gradlew -p desktop test --continue
      - name: Bundled FFmpeg diagnostics
        if: always()
        run: |
          f=$(find desktop -path '*test-home*' -name ffmpeg -type f | head -1); echo "$f"; ls -la "$(dirname "$f")" || true
          ldd "$f" | grep -i "not found" || echo "all libraries found"
          "$f" -hide_banner -version | head -2 || true
      - name: Screenshots
        if: success() || failure()
        run: ./gradlew -p desktop :app:screenshots
      - name: Package .deb
        if: success() || failure()
        run: ./gradlew -p desktop packageDeb
      - name: Install the .deb and start it
        if: success() || failure()
        run: |
          # The runner has no menu folders (a desktop system does); the .deb's menu entry needs them.
          sudo mkdir -p /usr/share/applications /usr/share/desktop-directories /usr/share/icons/hicolor
          sudo apt-get install -y ./desktop/app/build/compose/binaries/main/deb/*.deb
          ls /opt/apparat/bin
          mkdir -p desktop/app/build/screenshots
          /opt/apparat/bin/Apparat --self-test | tee desktop/app/build/screenshots/zz-deb-self-test.txt
          # Command-line batch on the installed app: two PDFs from the repo's test fixtures folder.
          mkdir -p /tmp/cli-in && cp desktop/packaging/icons/apparat.png /tmp/cli-in/a.png && cp desktop/packaging/icons/apparat-charcoal.png /tmp/cli-in/b.png
          /opt/apparat/bin/Apparat --batch convert-image --format webp --out /tmp/cli-out /tmp/cli-in | tee desktop/app/build/screenshots/zz-deb-cli.txt
          mkdir -p desktop/app/build/screenshots
          (xvfb-run -a -s "-screen 0 1280x960x24" bash -c '/opt/apparat/bin/Apparat > /tmp/apparat.log 2>&1 & sleep 25; import -window root desktop/app/build/screenshots/zz-installed-app.png; kill %1' ) || true
          cat /tmp/apparat.log
          cp /tmp/apparat.log desktop/app/build/screenshots/zz-installed-app.log || true
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p desktop/app/build/screenshots
          find desktop -path '*/build/test-results/test/*.xml' -exec grep -l '<failure' {} \; | xargs -r -I{} cp {} desktop/app/build/screenshots/ || true
          cd desktop/app/build/screenshots
          echo "${GITHUB_SHA}" > SOURCE_COMMIT
          git init -q && git checkout -q -b ci-screenshots
          git add -A && git -c user.name=desktop-ci -c user.email=ci@localhost commit -qm "Desktop CI screenshots for ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-ci
          path: |
            desktop/app/build/screenshots/
            desktop/app/build/compose/binaries/main/deb/*.deb
            desktop/*/build/reports/tests/

  flatpak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder xvfb imagemagick dbus-x11 > /dev/null
          # Ubuntu 24.04 blocks the user namespaces that bubblewrap (used by flatpak) needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build .flatpak
        run: desktop/packaging/flatpak/build-flatpak.sh
      - name: Install and start it
        run: |
          mkdir -p shots
          flatpak install --user -y --noninteractive desktop/build/Apparat.flatpak
          flatpak run com.omniforge.Apparat --self-test | tee shots/flatpak-self-test.txt || true
          (dbus-run-session -- xvfb-run -a -s "-screen 0 1280x960x24" bash -c 'flatpak run com.omniforge.Apparat > /tmp/flatpak.log 2>&1 & sleep 30; import -window root shots/flatpak-app.png; kill %1') || true
          cp /tmp/flatpak.log shots/flatpak-app.log || true
          ls -la desktop/build/Apparat.flatpak | tee shots/flatpak-size.txt
      - name: Publish to the ci-flatpak branch
        if: always()
        run: |
          mkdir -p shots && cd shots && echo "${GITHUB_SHA}" > SOURCE_COMMIT
          git init -q && git checkout -q -b ci-flatpak
          git add -A && git -c user.name=desktop-ci -c user.email=ci@localhost commit -qm "Flatpak check for ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-flatpak
