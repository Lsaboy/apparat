name: Desktop CI

on:
  push:
    branches: [ 'desktop-port' ]
    paths: [ 'desktop/**', 'app/src/main/java/**', '.github/workflows/desktop-ci.yml' ]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: ./gradlew -p desktop :app:compileKotlin --continue
